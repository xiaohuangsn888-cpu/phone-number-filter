<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="在浏览器中根据黑名单筛选电话号码。">
  <title>电话号码筛选工具</title>
  <style>
    :root{--bg:#07111f;--panel:#0d1b2d;--panel2:#101f33;--line:#243750;--text:#f7fbff;--muted:#9db0c8;--cyan:#35d6d0;--green:#55dda1;--amber:#ffc96b;--red:#ff7185;--shadow:0 22px 60px rgba(0,0,0,.35)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 5%,#12304b 0,transparent 32%),linear-gradient(160deg,#06101d,#091625 68%,#07101d);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    button,input{font:inherit}.shell{width:min(1120px,calc(100% - 32px));margin:auto;padding:42px 0 56px}.top{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:26px}.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:.76rem}.top h1{font-size:clamp(2rem,5vw,3.6rem);line-height:1.02;margin:9px 0 10px;letter-spacing:-.045em}.top p{color:var(--muted);margin:0;max-width:650px;line-height:1.55}.privacy{white-space:nowrap;padding:10px 14px;border:1px solid #31506a;background:#0a1a2a;border-radius:999px;color:#bfeee9;font-size:.86rem}
    .workspace{background:rgba(12,27,45,.92);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}.stepbar{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}.step{padding:16px 20px;color:var(--muted);display:flex;align-items:center;gap:10px;font-weight:700}.step b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#162c43;color:#c9d8e8;font-size:.8rem}.step.active{color:white;background:#10243a}.step.active b{background:var(--cyan);color:#05201f}
    .pad{padding:26px}.uploads{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{border:1px solid var(--line);background:var(--panel2);border-radius:18px;padding:20px;position:relative}.card h2{font-size:1.03rem;margin:0 0 6px}.card p{color:var(--muted);font-size:.88rem;line-height:1.45;margin:0 0 17px}.drop{min-height:150px;border:1px dashed #3a5875;border-radius:14px;display:grid;place-items:center;text-align:center;padding:18px;cursor:pointer;transition:.18s;background:#0a1828}.drop:hover,.drop.drag{border-color:var(--cyan);background:#0c2232;transform:translateY(-1px)}.drop input{position:absolute;opacity:0;pointer-events:none}.icon{font-size:1.6rem;display:block;margin-bottom:8px}.pick{color:#d9fefa;font-weight:800}.hint{display:block;color:#7188a3;font-size:.78rem;margin-top:6px}.fileState{margin-top:12px;min-height:22px;color:var(--green);font-size:.85rem;font-weight:700}
    .actionrow{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:20px}.note{color:var(--muted);font-size:.84rem}.primary{border:0;border-radius:12px;background:linear-gradient(135deg,var(--cyan),#63e5a4);color:#042322;font-weight:900;padding:14px 22px;cursor:pointer;box-shadow:0 10px 25px rgba(53,214,208,.2)}.primary:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}.error{display:none;margin-top:16px;padding:12px 14px;border-radius:10px;background:rgba(255,113,133,.1);border:1px solid rgba(255,113,133,.35);color:#ff9aaa}
    .results{display:none;margin-top:24px;border-top:1px solid var(--line);padding-top:24px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{background:#091827;border:1px solid var(--line);padding:15px;border-radius:14px}.stat strong{display:block;font-size:1.55rem;letter-spacing:-.03em}.stat span{color:var(--muted);font-size:.78rem}.outputs{display:grid;grid-template-columns:1fr 1fr;gap:16px}.output{border:1px solid var(--line);background:#0a1828;border-radius:16px;padding:18px}.outputHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.output h3{margin:0 0 5px;font-size:1rem}.output p{margin:0;color:var(--muted);font-size:.82rem;line-height:1.4}.count{font-weight:900;font-size:1.2rem}.call .count{color:var(--green)}.message .count{color:var(--amber)}.download{width:100%;margin-top:16px;border:1px solid #36516c;background:#142941;color:white;border-radius:11px;padding:11px;cursor:pointer;font-weight:800}.download:hover{border-color:var(--cyan)}.footer{text-align:center;color:#6f839b;font-size:.78rem;margin-top:18px}
    @media(max-width:760px){.shell{width:min(100% - 20px,1120px);padding-top:24px}.top{display:block}.privacy{display:inline-block;margin-top:16px}.uploads,.outputs{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.step{padding:12px 8px;font-size:.76rem;justify-content:center}.step span{display:none}.pad{padding:16px}.actionrow{align-items:stretch;flex-direction:column}.primary{width:100%}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div><div class="eyebrow">号码名单处理工具</div><h1>电话号码筛选工具</h1><p>将待处理号码与黑名单进行比对，并生成两个可直接使用的文件。</p></div>
      <div class="privacy">🔒 数据仅在本设备处理</div>
    </header>
    <section class="workspace">
      <div class="stepbar"><div class="step active"><b>1</b><span>上传名单</span></div><div class="step"><b>2</b><span>比对筛选</span></div><div class="step"><b>3</b><span>下载结果</span></div></div>
      <div class="pad">
        <div class="uploads">
          <article class="card"><h2>待处理号码</h2><p>上传 <b>source.txt</b>，每行填写一个电话号码。</p><label class="drop" id="sourceDrop"><input type="file" id="sourceFile" accept=".txt,text/plain"><span><span class="icon">↑</span><span class="pick">选择或拖入 source.txt</span><span class="hint">TXT 文件 · 每行一个号码</span></span></label><div class="fileState" id="sourceState">尚未选择文件</div></article>
          <article class="card"><h2>黑名单</h2><p>上传每日更新的 <b>blacklist.txt</b> 文件。</p><label class="drop" id="blackDrop"><input type="file" id="blackFile" accept=".txt,text/plain"><span><span class="icon">⊘</span><span class="pick">选择或拖入 blacklist.txt</span><span class="hint">TXT 文件 · 每行一个号码</span></span></label><div class="fileState" id="blackState">尚未选择文件</div></article>
        </div>
        <div class="actionrow"><div class="note">系统会自动删除空行和重复号码。</div><button class="primary" id="process" disabled>比对并生成名单</button></div>
        <div class="error" id="error"></div>
        <div class="results" id="results">
          <div class="stats"><div class="stat"><strong id="sourceCount">0</strong><span>source 号码数</span></div><div class="stat"><strong id="blackCount">0</strong><span>黑名单号码数</span></div><div class="stat"><strong id="callCount">0</strong><span>短信 + 电话</span></div><div class="stat"><strong id="onlyCount">0</strong><span>仅短信</span></div></div>
          <div class="outputs">
            <div class="output call"><div class="outputHead"><div><h3>可接收短信和电话</h3><p>存在于 source，但不在黑名单中。</p></div><div class="count" id="callBadge">0</div></div><button class="download" id="downloadCall">下载 message_and_call.txt</button></div>
            <div class="output message"><div class="outputHead"><div><h3>仅接收短信</h3><p>同时存在于 source 和黑名单中。</p></div><div class="count" id="onlyBadge">0</div></div><button class="download" id="downloadOnly">下载 message_only.txt</button></div>
          </div>
        </div>
      </div>
    </section>
    <div class="footer">文件仅在浏览器本地处理，不会上传到服务器。</div>
  </main>
  <script>
    const $=s=>document.querySelector(s);let files={source:null,black:null},output={call:[],only:[]};
    function lines(text){const seen=new Set(),out=[];text.replace(/^\uFEFF/,'').split(/\r?\n/).forEach(x=>{const n=x.trim();if(n&&!seen.has(n)){seen.add(n);out.push(n)}});return out}
    function bind(inputId,dropId,key,stateId){const input=$(inputId),drop=$(dropId),state=$(stateId);const set=f=>{if(!f)return;if(!f.name.toLowerCase().endsWith('.txt')){showError('请选择 .txt 格式的文件');return}files[key]=f;state.textContent=`✓ ${f.name} · ${(f.size/1024).toFixed(1)} KB`;$('#process').disabled=!(files.source&&files.black);hideError()};input.addEventListener('change',e=>set(e.target.files[0]));['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>set(e.dataTransfer.files[0]))}
    function showError(msg){$('#error').textContent=msg;$('#error').style.display='block'}function hideError(){$('#error').style.display='none'}
    bind('#sourceFile','#sourceDrop','source','#sourceState');bind('#blackFile','#blackDrop','black','#blackState');
    $('#process').addEventListener('click',async()=>{try{hideError();const [s,b]=await Promise.all([files.source.text(),files.black.text()]);const source=lines(s),black=lines(b),blackSet=new Set(black);output.call=source.filter(n=>!blackSet.has(n));output.only=source.filter(n=>blackSet.has(n));$('#sourceCount').textContent=source.length;$('#blackCount').textContent=black.length;$('#callCount').textContent=$('#callBadge').textContent=output.call.length;$('#onlyCount').textContent=$('#onlyBadge').textContent=output.only.length;$('#results').style.display='block';document.querySelectorAll('.step')[1].classList.add('active');document.querySelectorAll('.step')[2].classList.add('active');$('#results').scrollIntoView({behavior:'smooth',block:'nearest'})}catch(e){showError('无法读取文件，请重试。')}});
    function download(name,data){const blob=new Blob([data.join('\n')+(data.length?'\n':'')],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
    $('#downloadCall').onclick=()=>download('message_and_call.txt',output.call);$('#downloadOnly').onclick=()=>download('message_only.txt',output.only);
  </script>
</body>
</html>
