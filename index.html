<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>电话号码筛选工具</title>

  <style>
    :root{
      --bg:#07111f;
      --panel:#0d1b2d;
      --panel2:#101f33;
      --line:#243750;
      --text:#f7fbff;
      --muted:#91abc8;
      --cyan:#35d6d0;
      --green:#55dda1;
      --amber:#ffc96b;
      --red:#ff7185;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      color:var(--text);
      font-family:Arial,"Microsoft YaHei",sans-serif;
      background:
        radial-gradient(circle at 12% 5%,#12304b 0,transparent 32%),
        linear-gradient(160deg,#06101d,#07111f 60%);
    }

    button,input{font:inherit}

    .shell{
      width:min(1050px,calc(100% - 30px));
      margin:auto;
      padding:45px 0;
    }

    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:25px;
      margin-bottom:28px;
    }

    .eyebrow{
      color:var(--cyan);
      font-weight:800;
      letter-spacing:2px;
      font-size:14px;
    }

    h1{
      margin:10px 0;
      font-size:clamp(35px,6vw,62px);
      line-height:1;
    }

    .description{
      margin:0;
      color:var(--muted);
      line-height:1.7;
    }

    .privacy{
      border:1px solid #315273;
      border-radius:30px;
      padding:12px 18px;
      color:#bce4ff;
      white-space:nowrap;
    }

    .workspace{
      background:rgba(12,27,45,.95);
      border:1px solid var(--line);
      border-radius:24px;
      overflow:hidden;
      box-shadow:0 20px 55px rgba(0,0,0,.3);
    }

    .steps{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      border-bottom:1px solid var(--line);
    }

    .step{
      padding:20px;
      color:var(--muted);
      font-weight:700;
    }

    .step span{
      display:inline-grid;
      place-items:center;
      width:27px;
      height:27px;
      margin-right:8px;
      border-radius:50%;
      background:#17324f;
    }

    .step.active{
      color:white;
    }

    .step.active span{
      color:#062126;
      background:var(--cyan);
    }

    .content{padding:28px}

    .upload{
      padding:25px;
      border:1px solid var(--line);
      border-radius:18px;
      background:var(--panel2);
    }

    .upload h2{
      margin:0 0 8px;
      font-size:20px;
    }

    .upload p{
      color:var(--muted);
      margin:0 0 20px;
    }

    .dropzone{
      display:block;
      padding:42px 20px;
      text-align:center;
      border:1px dashed #3d668d;
      border-radius:16px;
      background:#091a2b;
      cursor:pointer;
      transition:.2s;
    }

    .dropzone:hover{
      border-color:var(--cyan);
      background:#0b2135;
    }

    .dropzone strong{
      display:block;
      font-size:18px;
      margin:10px;
    }

    .dropzone small{color:var(--muted)}

    #sourceFile{display:none}

    #fileName{
      margin-top:15px;
      color:var(--green);
      font-weight:700;
    }

    .action{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
      margin-top:22px;
    }

    .note{
      color:var(--muted);
      font-size:14px;
    }

    #filterButton{
      border:0;
      border-radius:12px;
      padding:15px 25px;
      background:linear-gradient(135deg,#22bec1,#55dda1);
      color:#062126;
      font-weight:900;
      cursor:pointer;
    }

    #filterButton:disabled{
      opacity:.45;
      cursor:not-allowed;
    }

    #status{
      display:none;
      margin-top:20px;
      padding:14px 16px;
      border-radius:12px;
      background:#12283f;
      color:#cfe9ff;
    }

    #status.error{
      display:block;
      color:#ffd3da;
      border:1px solid #733b49;
      background:#321923;
    }

    .results{
      display:none;
      margin-top:26px;
      padding-top:26px;
      border-top:1px solid var(--line);
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:14px;
      margin-bottom:18px;
    }

    .stat{
      padding:18px;
      border:1px solid var(--line);
      border-radius:14px;
      background:#0a192a;
    }

    .stat small{
      color:var(--muted);
      display:block;
      margin-bottom:7px;
    }

    .stat strong{font-size:26px}

    .outputs{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px;
    }

    .output{
      padding:20px;
      border:1px solid var(--line);
      border-radius:16px;
      background:#0a192a;
    }

    .output h3{margin:0 0 8px}

    .output p{
      min-height:42px;
      color:var(--muted);
      line-height:1.5;
    }

    .download{
      width:100%;
      border:0;
      border-radius:11px;
      padding:13px;
      color:#061b20;
      background:var(--green);
      font-weight:900;
      cursor:pointer;
    }

    .download.sms{background:var(--amber)}

    footer{
      text-align:center;
      color:#6686a8;
      font-size:13px;
      padding:24px;
    }

    @media(max-width:720px){
      .top{display:block}
      .privacy{display:inline-block;margin-top:18px}
      .steps{grid-template-columns:1fr}
      .step{padding:12px 20px}
      .stats,.outputs{grid-template-columns:1fr}
      .action{display:block}
      #filterButton{width:100%;margin-top:18px}
    }
  </style>
</head>

<body>
  <main class="shell">
    <header class="top">
      <div>
        <div class="eyebrow">号码名单处理工具</div>
        <h1>电话号码筛选工具</h1>
        <p class="description">
          上传待处理的号码名单，系统将自动与受保护的黑名单进行对比。
        </p>
      </div>

      <div class="privacy">🔒 黑名单受保护</div>
    </header>

    <section class="workspace">
      <div class="steps">
        <div class="step active"><span>1</span>上传名单</div>
        <div class="step"><span>2</span>自动筛选</div>
        <div class="step"><span>3</span>下载结果</div>
      </div>

      <div class="content">
        <div class="upload">
          <h2>上传待处理名单</h2>
          <p>请选择 source.txt，每行填写一个电话号码。</p>

          <label class="dropzone" for="sourceFile">
            <div style="font-size:30px">↑</div>
            <strong>点击选择或拖放 source.txt</strong>
            <small>仅支持 TXT 文件，每行一个号码</small>
          </label>

          <input id="sourceFile" type="file" accept=".txt,text/plain">
          <div id="fileName">尚未选择文件</div>
        </div>

        <div class="action">
          <div class="note">
            空行和重复号码会被自动删除，用户无法查看或修改黑名单。
          </div>
          <button id="filterButton" disabled>开始筛选并生成名单</button>
        </div>

        <div id="status"></div>

        <section class="results" id="results">
          <div class="stats">
            <div class="stat">
              <small>原始号码总数</small>
              <strong id="totalCount">0</strong>
            </div>
            <div class="stat">
              <small>可拨打和发短信</small>
              <strong id="callCount">0</strong>
            </div>
            <div class="stat">
              <small>仅可发送短信</small>
              <strong id="smsCount">0</strong>
            </div>
          </div>

          <div class="outputs">
            <div class="output">
              <h3>📞 可拨打和发短信</h3>
              <p>这些号码不在黑名单中，可以用于拨打电话和发送短信。</p>
              <button class="download" id="downloadCall">
                下载 call_and_sms.txt
              </button>
            </div>

            <div class="output">
              <h3>💬 仅可发送短信</h3>
              <p>这些号码存在于黑名单中，只能发送短信，不能拨打电话。</p>
              <button class="download sms" id="downloadSms">
                下载 sms_only.txt
              </button>
            </div>
          </div>
        </section>
      </div>

      <footer>号码通过安全接口进行筛选，黑名单不会显示给普通用户。</footer>
    </section>
  </main>

  <script>
    const API_URL =
      "https://phone-number-filter-api.xiaohuangsn888.workers.dev";

    const sourceFile = document.getElementById("sourceFile");
    const fileName = document.getElementById("fileName");
    const filterButton = document.getElementById("filterButton");
    const statusBox = document.getElementById("status");
    const results = document.getElementById("results");

    let callNumbers = [];
    let smsNumbers = [];

    function normalizePhone(value) {
      return String(value || "").replace(/[^\d+]/g, "").trim();
    }

    function parseNumbers(text) {
      return [
        ...new Set(
          text
            .split(/\r?\n/)
            .map(normalizePhone)
            .filter(Boolean)
        )
      ];
    }

    function setStatus(message, isError = false) {
      statusBox.textContent = message;
      statusBox.style.display = "block";
      statusBox.className = isError ? "error" : "";
    }

    function downloadText(fileName, numbers) {
      const content = numbers.length ? numbers.join("\n") + "\n" : "";
      const blob = new Blob([content], {
        type: "text/plain;charset=utf-8"
      });

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();

      URL.revokeObjectURL(url);
    }

    sourceFile.addEventListener("change", () => {
      const file = sourceFile.files[0];

      if (!file) {
        fileName.textContent = "尚未选择文件";
        filterButton.disabled = true;
        return;
      }

      fileName.textContent = "已选择：" + file.name;
      filterButton.disabled = false;
      results.style.display = "none";
      statusBox.style.display = "none";
    });

    filterButton.addEventListener("click", async () => {
      const file = sourceFile.files[0];

      if (!file) {
        setStatus("请先选择 source.txt 文件。", true);
        return;
      }

      filterButton.disabled = true;
      filterButton.textContent = "正在筛选，请稍候...";
      results.style.display = "none";

      try {
        const text = await file.text();
        const numbers = parseNumbers(text);

        if (!numbers.length) {
          throw new Error("文件中没有有效的电话号码。");
        }

        callNumbers = [];
        smsNumbers = [];

        // Chia nhỏ danh sách để xử lý được tệp có nhiều số
        const batchSize = 80;

        for (let i = 0; i < numbers.length; i += batchSize) {
          const batch = numbers.slice(i, i + batchSize);

          setStatus(
            `正在处理 ${Math.min(i + batch.length, numbers.length)} / ${numbers.length} 个号码...`
          );

          const response = await fetch(API_URL + "/filter", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              numbers: batch
            })
          });

          const data = await response.json();

          if (!response.ok || !data.success) {
            throw new Error(data.message || "服务器筛选失败。");
          }

          callNumbers.push(...(data.callable_numbers || []));
          smsNumbers.push(...(data.sms_only_numbers || []));
        }

        document.getElementById("totalCount").textContent =
          numbers.length;

        document.getElementById("callCount").textContent =
          callNumbers.length;

        document.getElementById("smsCount").textContent =
          smsNumbers.length;

        results.style.display = "block";
        setStatus("筛选完成，现在可以下载两个结果文件。");
      } catch (error) {
        setStatus("处理失败：" + error.message, true);
      } finally {
        filterButton.disabled = false;
        filterButton.textContent = "开始筛选并生成名单";
      }
    });

    document.getElementById("downloadCall").addEventListener("click", () => {
      downloadText("call_and_sms.txt", callNumbers);
    });

    document.getElementById("downloadSms").addEventListener("click", () => {
      downloadText("sms_only.txt", smsNumbers);
    });
  </script>
</body>
</html>
